<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文档编辑 - AI Markdown 知识库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-screen flex flex-col bg-gray-50">
    <!-- 顶部工具栏 -->
    <header class="h-14 bg-white border-b flex items-center justify-between px-4">
        <!-- 左侧文档信息 -->
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="text-gray-600"><i class="fa-solid fa-arrow-left"></i></a>
            <input type="text" value="Vue3 学习笔记" class="text-lg font-medium border-none focus:outline-none w-48">
            <span class="text-gray-400 text-sm">未保存</span>
        </div>

        <!-- 中间功能栏 -->
        <div class="flex items-center gap-2">
            <button class="px-2 py-1 hover:bg-gray-100 rounded"><i class="fa-solid fa-bold"></i></button>
            <button class="px-2 py-1 hover:bg-gray-100 rounded"><i class="fa-solid fa-list-ol"></i></button>
            <button class="px-2 py-1 hover:bg-gray-100 rounded"><i class="fa-solid fa-code"></i></button>
            <div class="w-px h-6 bg-gray-200 mx-2"></div>
            <!-- AI核心功能 -->
            <button class="px-3 py-1 bg-blue-50 text-[#165DFF] rounded text-sm">AI 润色</button>
            <button class="px-3 py-1 hover:bg-gray-100 text-sm">生成目录</button>
            <button class="px-3 py-1 hover:bg-gray-100 text-sm">代码优化</button>
            <button class="px-3 py-1 hover:bg-gray-100 text-sm">导出</button>
        </div>

        <!-- 右侧协作+分享 -->
        <div class="flex items-center gap-3">
            <!-- 实时协作成员 -->
            <div class="flex -space-x-2">
                <img src="https://picsum.photos/32" class="w-8 h-8 rounded-full border-2 border-white">
                <img src="https://picsum.photos/33" class="w-8 h-8 rounded-full border-2 border-white">
            </div>
            <button class="px-3 py-1 bg-[#165DFF] text-white rounded text-sm">分享</button>
        </div>
    </header>

    <!-- 双栏编辑器区域 -->
    <div class="flex-1 flex overflow-hidden">
        <!-- 左侧编辑区 -->
        <div class="w-1/2 border-r border-gray-200 bg-white p-4 overflow-y-auto">
            <textarea class="w-full h-full border-none focus:outline-none resize-none font-mono text-gray-800" placeholder="请输入 Markdown 内容..."># Vue3 学习笔记
## 核心特性
- 组合式API
- 响应式系统
- TypeScript 支持

```javascript
console.log('Hello Vue3')
```</textarea>
        </div>

        <!-- 右侧预览区 -->
        <div class="w-1/2 bg-white p-6 overflow-y-auto prose max-w-none">
            <h1>Vue3 学习笔记</h1>
            <h2>核心特性</h2>
            <ul>
                <li>组合式API</li>
                <li>响应式系统</li>
                <li>TypeScript 支持</li>
            </ul>
            <pre><code class="language-javascript">console.log('Hello Vue3')</code></pre>
        </div>
    </div>

    <!-- 底部状态栏 -->
    <footer class="h-8 bg-white border-t flex items-center justify-between px-4 text-xs text-gray-500">
        <p>行数：10 | 字符数：128</p>
        <p>实时协作中 · 自动保存</p>
    </footer>
</body>
</html>
