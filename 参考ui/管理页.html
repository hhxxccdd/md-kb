<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的文档 - AI 增强知识库</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .home-page {
      width: 100vw;
      min-height: 100vh;
      background: #f5f7fa;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航栏 - 和编辑页顶部完全对齐 */
    .header {
      width: 100%;
      height: 60px;
      background: #ffffff;
      border-bottom: 1px solid #e5e6eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left .logo {
      font-size: 18px;
      font-weight: 600;
      color: #1d2129;
      margin: 0;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* 搜索框 */
    .search-box {
      position: relative;
    }
    .search-input {
      width: 240px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid #e5e6eb;
      border-radius: 6px;
      font-size: 14px;
      background: #f5f7fa;
      transition: all 0.2s;
    }
    .search-input:focus {
      outline: none;
      border-color: #1677ff;
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1);
    }
    .search-input::placeholder {
      color: #86909c;
    }

    /* 用户信息 */
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1677ff;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .username {
      font-size: 14px;
      color: #1d2129;
    }

    /* 按钮样式 - 和编辑页完全统一 */
    .btn-primary {
      height: 36px;
      padding: 0 16px;
      background: #1677ff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #40a9ff;
    }
    .btn-primary:active {
      background: #0958d9;
    }

    .btn-text {
      background: transparent;
      border: none;
      font-size: 14px;
      color: #4e5969;
      cursor: pointer;
      transition: all 0.2s;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .btn-text:hover {
      color: #1677ff;
      background: #f5f7fa;
    }
    .btn-text.danger:hover {
      color: #ff4d4f;
    }

    /* 主体内容区 */
    .main-content {
      flex: 1;
      padding: 32px 24px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* 分类切换tab */
    .category-tab {
      display: flex;
      gap: 32px;
      margin-bottom: 24px;
      border-bottom: 1px solid #e5e6eb;
    }
    .category-item {
      font-size: 16px;
      font-weight: 500;
      color: #86909c;
      padding-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
      position: relative;
    }
    .category-item.active {
      color: #1677ff;
      border-color: #1677ff;
    }
    .category-item:hover {
      color: #40a9ff;
    }
    .category-count {
      font-size: 12px;
      background: #f5f7fa;
      color: #86909c;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 6px;
    }
    .category-item.active .category-count {
      background: #e6f7ff;
      color: #1677ff;
    }

    /* 加载/空状态 */
    .loading, .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      color: #86909c;
    }
    .empty-state .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    .empty-state h3 {
      font-size: 20px;
      color: #4e5969;
      margin: 0 0 8px 0;
    }
    .empty-state p {
      font-size: 14px;
      margin: 0 0 24px 0;
    }

    /* 文档卡片网格 */
    .doc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .doc-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .doc-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .doc-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .doc-title {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
      color: #1d2129;
      margin: 0;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .doc-title:hover {
      color: #1677ff;
    }

    .doc-tag {
      flex-shrink: 0;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f5f7fa;
      color: #86909c;
    }
    .doc-tag.public {
      background: #e6f7ff;
      color: #1677ff;
    }
    .doc-tag.team {
      background: #fff7e6;
      color: #fa8c16;
    }

    .doc-meta {
      flex: 1;
    }
    .update-time {
      font-size: 12px;
      color: #86909c;
    }
    .doc-author {
      font-size: 12px;
      color: #4e5969;
      margin-top: 4px;
    }

    .doc-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid #f5f7fa;
    }

    /* 响应式适配 */
    @media (max-width: 768px) {
      .header {
        padding: 0 16px;
      }
      .search-input {
        width: 160px;
      }
      .username {
        display: none;
      }
      .main-content {
        padding: 20px 16px;
      }
      .doc-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="home-page">
    <!-- 顶部导航栏 - 和编辑页顶部完全对齐 -->
    <header class="header">
      <div class="header-left">
        <h2 class="logo">AI 知识库</h2>
      </div>
      <div class="header-right">
        <div class="search-box">
          <input 
            type="text" 
            placeholder="搜索文档..."
            class="search-input"
            id="searchInput"
            oninput="filterDocs()"
          />
        </div>
        <button class="btn-primary" onclick="handleCreateDoc()">
          + 新建文档
        </button>
        <div class="user-info">
          <div class="user-avatar">U</div>
          <span class="username">demo_user</span>
          <button class="btn-text" onclick="handleLogout()">退出</button>
        </div>
      </div>
    </header>

    <!-- 主体内容区 -->
    <main class="main-content">
      <!-- 分类切换tab -->
      <div class="category-tab">
        <div class="category-item active" id="privateTab" onclick="switchCategory('private')">
          我的私有文档
          <span class="category-count" id="privateCount">2</span>
        </div>
        <div class="category-item" id="teamTab" onclick="switchCategory('team')">
          团队公开文档
          <span class="category-count" id="teamCount">2</span>
        </div>
      </div>

      <!-- 文档列表（JS动态渲染） -->
      <div id="docListContainer"></div>
    </main>
  </div>

  <script>
    // 模拟文档数据
    const allDocs = {
      private: [
        { id: 1, title: 'LLM for Data Management 学习笔记', isPublic: false, category: 'private', author: 'demo_user', updatedAt: '2026-04-02T10:30:00Z' },
        { id: 2, title: 'RAG 检索增强生成技术总结', isPublic: false, category: 'private', author: 'demo_user', updatedAt: '2026-04-01T15:20:00Z' }
      ],
      team: [
        { id: 3, title: '向量数据库选型对比', isPublic: true, category: 'team', author: 'team_member_a', updatedAt: '2026-03-31T09:15:00Z' },
        { id: 4, title: 'Prisma 关联关系设计最佳实践', isPublic: true, category: 'team', author: 'team_member_b', updatedAt: '2026-03-30T14:45:00Z' }
      ]
    };

    let currentCategory = 'private';
    let searchKeyword = '';

    // 格式化时间
    function formatTime(timeStr) {
      const date = new Date(timeStr);
      return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }

    // 切换分类
    function switchCategory(category) {
      currentCategory = category;
      searchKeyword = '';
      document.getElementById('searchInput').value = '';

      // 更新tab高亮
      const privateTab = document.getElementById('privateTab');
      const teamTab = document.getElementById('teamTab');
      if (category === 'private') {
        privateTab.classList.add('active');
        teamTab.classList.remove('active');
      } else {
        teamTab.classList.add('active');
        privateTab.classList.remove('active');
      }

      // 渲染文档列表
      renderDocList();
    }

    // 渲染文档列表
    function renderDocList() {
      const container = document.getElementById('docListContainer');
      const docs = allDocs[currentCategory].filter(doc => 
        doc.title.toLowerCase().includes(searchKeyword.toLowerCase())
      );

      // 更新计数
      document.getElementById('privateCount').textContent = allDocs.private.length;
      document.getElementById('teamCount').textContent = allDocs.team.length;

      if (docs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📝</div>
            <h3>暂无${currentCategory === 'private' ? '私有' : '团队公开'}文档</h3>
            <p>${currentCategory === 'private' ? '点击「新建文档」，开始你的第一篇笔记' : '暂无团队成员分享的公开文档'}</p>
            ${currentCategory === 'private' ? '<button class="btn-primary" onclick="handleCreateDoc()">新建文档</button>' : ''}
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="doc-grid">
          ${docs.map(doc => `
            <div class="doc-card">
              <div class="doc-card-header">
                <h3 class="doc-title" onclick="handleEditDoc(${doc.id})">${doc.title}</h3>
                <span class="doc-tag ${doc.category}">
                  ${doc.category === 'private' ? '私有' : '团队公开'}
                </span>
              </div>
              <div class="doc-meta">
                <span class="update-time">更新于 ${formatTime(doc.updatedAt)}</span>
                ${doc.category === 'team' ? `<div class="doc-author">作者：${doc.author}</div>` : ''}
              </div>
              <div class="doc-actions">
                <button class="btn-text" onclick="handleEditDoc(${doc.id})">${doc.category === 'private' ? '编辑' : '查看'}</button>
                ${doc.category === 'private' ? `
                  <button class="btn-text" onclick="handleTogglePermission(${doc.id})">设为公开</button>
                  <button class="btn-text danger" onclick="handleDeleteDoc(${doc.id})">删除</button>
                ` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // 搜索过滤
    function filterDocs() {
      searchKeyword = document.getElementById('searchInput').value;
      renderDocList();
    }

    // 新建文档
    function handleCreateDoc() {
      const newDoc = {
        id: Date.now(),
        title: '未命名文档',
        isPublic: false,
        category: 'private',
        author: 'demo_user',
        updatedAt: new Date().toISOString()
      };
      allDocs.private.unshift(newDoc);
      renderDocList();
      alert('新建文档成功！跳转到编辑页');
    }

    // 编辑/查看文档
    function handleEditDoc(id) {
      alert(`跳转到${currentCategory === 'private' ? '编辑' : '查看'}页：文档ID ${id}`);
    }

    // 修改文档权限
    function handleTogglePermission(id) {
      const doc = allDocs.private.find(d => d.id === id);
      if (doc) {
        if (confirm(`确定要将文档「${doc.title}」设为团队公开吗？`)) {
          // 从私有移到团队公开
          allDocs.private = allDocs.private.filter(d => d.id !== id);
          doc.category = 'team';
          doc.isPublic = true;
          allDocs.team.unshift(doc);
          renderDocList();
        }
      }
    }

    // 删除文档
    function handleDeleteDoc(id) {
      const doc = allDocs.private.find(d => d.id === id);
      if (confirm(`确定要删除文档「${doc.title}」吗？`)) {
        allDocs.private = allDocs.private.filter(d => d.id !== id);
        renderDocList();
      }
    }

    // 退出登录
    function handleLogout() {
      if (confirm('确定要退出登录吗？')) {
        alert('退出成功！跳转到登录页');
      }
    }

    // 页面加载渲染
    document.addEventListener('DOMContentLoaded', () => {
      renderDocList();
    });
  </script>
</body>
</html>
